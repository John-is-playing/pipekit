[project]
name = "pipekit"
version = "0.3.1"
description = "用于演示 Fissue 的小型分片流水线/区间计算库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pipekit maintainers" }]
keywords = ["pipeline", "interval", "slice", "pagination", "demo"]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/"
Issues = "https://github.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
